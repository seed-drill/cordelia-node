[workspace]
members = [
    "crates/cordelia-core",
    "crates/cordelia-crypto",
    "crates/cordelia-storage",
    "crates/cordelia-network",
    "crates/cordelia-api",
    "crates/cordelia-sync",
    "crates/cordelia-node",
    "crates/cordelia-test",
]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.10"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/seed-drill/cordelia-node"
authors = ["Seed Drill <hello@seeddrill.ai>"]

[workspace.dependencies]
ureq = { version = "3.4", default-features = false, features = ["json"] }
# Internal crates
cordelia-core = { path = "crates/cordelia-core" }
cordelia-crypto = { path = "crates/cordelia-crypto" }
cordelia-storage = { path = "crates/cordelia-storage" }
cordelia-network = { path = "crates/cordelia-network" }
cordelia-api = { path = "crates/cordelia-api" }
cordelia-sync = { path = "crates/cordelia-sync" }
cordelia-test = { path = "crates/cordelia-test" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Crypto
ring = "0.17"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
curve25519-dalek = "4"
rand = "0.8"
# The twelve words of a recovery phrase (decision 2026-10-04 §5): the
# English list, which the crate always has, and none of its other features
# but the one that overwrites the words when they are dropped.
bip39 = { version = "3", default-features = false, features = ["zeroize"] }
# Overwrites a secret when its value is dropped. The curve crates above
# already bring it: this adds no crate to the build.
zeroize = "1"

# Encoding
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
bech32 = "0.11"
hex = "0.4"
base64 = "0.22"

# QUIC transport
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }

# HTTP API
actix-web = "4"
# Not used directly: actix-web brings it. Before 2.9.1 a graceful stop
# could wait for ever (#99), so the node asks for one after that.
actix-server = "2.9.1"
actix-rt = "2"

# Storage
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# X.509 parsing
x509-parser = "0.16"
time = "0.3"

# Utilities
uuid = { version = "1", features = ["v4"] }
ulid = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }

# Testing
tempfile = "3"

# The arithmetic of the curve, and the hashing under it, are optimised in
# every build. An entry carries two signatures (decision 2026-10-04 §2.3),
# and a device checks both each time it reads one. Unoptimised, one check
# takes milliseconds: a test build would then hold the store for most of
# a second at a time, and a command that asks its node would not be
# answered within its second.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
