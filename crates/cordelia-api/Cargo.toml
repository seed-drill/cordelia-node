[package]
name = "cordelia-api"
description = "REST API endpoints, bearer token auth, Prometheus metrics, health checks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cordelia-core = { workspace = true }
cordelia-storage = { workspace = true }
cordelia-crypto = { workspace = true }
actix-web = { workspace = true }
actix-rt = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# Overwrites a secret when its value is dropped. The crypto crate already
# brings it: this adds no crate to the build.
zeroize = { workspace = true }
# The seven categories of characters that the messages' commands take out
# of a name, a label, a subject or a link, and escape in a body.
unicode-general-category = { workspace = true }
# The node's token is compared in constant time. The crypto crates
# already bring it: this adds no crate to the build.
subtle = "2.6.1"

[target.'cfg(unix)'.dependencies]
# To kill git's process group at its deadline. Tokio already brings it:
# this adds no crate to the build.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
# The statements a test counts, to bound the work of a request.
rusqlite = { workspace = true, features = ["trace"] }
