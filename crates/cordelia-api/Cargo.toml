[package]
name = "cordelia-api"
description = "REST API endpoints, bearer token auth, Prometheus metrics, health checks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cordelia-core = { workspace = true }
cordelia-storage = { workspace = true }
cordelia-crypto = { workspace = true }
actix-web = { workspace = true }
actix-rt = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# Overwrites a secret when its value is dropped. The crypto crate already
# brings it: this adds no crate to the build.
zeroize = { workspace = true }
# The seven categories of characters that the messages' commands take out
# of a name, a label, a subject or a link, and escape in a body.
unicode-general-category = { workspace = true }
# The node's token is compared in constant time. The crypto crates
# already bring it: this adds no crate to the build.
subtle = "2.6.1"

[target.'cfg(unix)'.dependencies]
# To kill git's process group at its deadline. Tokio already brings it:
# this adds no crate to the build.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
# The statements a test counts, to bound the work of a request.
rusqlite = { workspace = true, features = ["trace"] }
# A server of git over HTTPS on loopback, for the tests of a repository's
# list read with git (tests/common). The network crate already brings
# both: this adds no crate to the build.
rustls = { workspace = true }
rcgen = { workspace = true }
# Another spelling of a key, which a repository's list refuses (members.rs).
bech32 = { workspace = true }
# A key's twin, and a signature under it, as a thief would make them. The
# crypto crate already brings both: this adds no crate to the build.
curve25519-dalek = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# A terminal of a test's own, at which nothing that git runs may ask. The
# node's crate already brings it: this adds no crate to the build.
rustix = { version = "1", features = ["pty"] }

[lints.rust]
# CI's coverage job builds with `--cfg coverage` (ci.yml), which leaves out
# the test of a take-out's holds of the lock (shared.rs).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
