[package]
name = "cordelia-node"
description = "Cordelia node binary: CLI, daemon lifecycle, signal handling"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cordelia"
path = "src/main.rs"

[dependencies]
cordelia-core = { workspace = true }
cordelia-crypto = { workspace = true }
cordelia-storage = { workspace = true }
cordelia-network = { workspace = true }
cordelia-api = { workspace = true }
cordelia-sync = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
actix-web = { workspace = true }
# The HTTP server's version, at least the one without #99's hang.
actix-server = { workspace = true }
rusqlite = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# The recovery phrase, typed at a terminal, is in memory that is
# overwritten.
zeroize = { workspace = true }

# The terminal that a command asks at: echo off while the recovery phrase
# is typed, and the machine's name for a device's label.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios", "stdio", "system"] }

[dev-dependencies]
tempfile = { workspace = true }
# A terminal of a test's own, to run a command at as a person does.
rustix = { version = "1", features = ["pty"] }
# A clock that tests can run ahead, for the waits in a node's stopping.
tokio = { workspace = true, features = ["test-util"] }
