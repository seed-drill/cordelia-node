[package]
name = "cordelia-core"
description = "Shared types, traits, config, and error types for Cordelia"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
bech32 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
# CI's coverage job builds with `--cfg coverage` (ci.yml), which leaves out
# the test of what timing a take of the node's lock costs (lock.rs).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
