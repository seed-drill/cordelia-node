# How `cargo nextest` runs this workspace's tests: each test in a process
# of its own, as many at once as the machine has threads. CI runs the
# profiles below in shards (ci.yml); TESTING.md says how to run them here.

# The slot numbers that the real-process tests take their ports by
# (crates/cordelia-node/tests/common/mod.rs, `free_port`) came in 0.9.90,
# and the priorities below in 0.9.91.
nextest-version = { required = "0.9.91" }

[profile.default]
# A test is said to be slow after each minute, and is stopped after 30.
slow-timeout = { period = "60s", terminate-after = 30 }

# The library tests of cordelia-sync and cordelia-storage start first.
# Some of them keep a core busy for minutes (the sequences, and a ring
# written over ten thousand times): one that started last would hold its
# shard well after the rest. Only the order changes.
[[profile.default.overrides]]
filter = '(package(cordelia-sync) | package(cordelia-storage)) & kind(lib)'
priority = 50

# The tests that `cargo test --all` runs, as a pull request's gate runs
# them. Every test runs, whatever fails, and none is run again: a test
# that fails once fails the run. Each failure is shown when it happens and
# again at the end.
[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"
# The longest of these tests takes about nine minutes on a slow machine
# of four cores: one that has run for 15 is stopped, and fails.
slow-timeout = { period = "60s", terminate-after = 15 }

[profile.ci.junit]
path = "junit.xml"

# The ignored tests of cordelia-node, which CI's "out of reach" jobs run
# on main: some wait out a relay's five minutes out of reach, and the
# longest takes about 14 minutes in CI. One that has run for 30 is stopped.
[profile.ci-out-of-reach]
fail-fast = false
retries = 0
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 30 }

[profile.ci-out-of-reach.junit]
path = "junit.xml"
