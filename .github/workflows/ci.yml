name: CI

# A pull request's gate: fmt and clippy, the doc tests, and every test
# that `cargo test --all` runs, built once and run by cargo nextest in
# shards at once. The job `test` passes only when all of it passed.
#
# On a push to main, each night and when run by hand, two more run, which
# do not gate a pull request: the ignored tests of cordelia-node ("out of
# reach"), in shards too, and coverage. When one of them fails, the run
# on main fails.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

# A new commit on a pull request cancels the run of the one before, so a
# run that is overtaken ends cancelled, not red. Every other run (a push
# to main, a night's, one by hand) is a group of its own: none of them is
# cancelled, and none waits for another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The version before: alpha.19, the one release that this version works
  # beside and takes over from (decision 2026-11-10 (older kind), rules 4
  # and 10). The tests that run it as a relay or a device beside this
  # build read it. The SHA-256 of that release's cordelia-linux-amd64, as
  # this repository names it, worked out from the binary and checked
  # against the release's own .sha256: the download is checked against it,
  # and not against a checksum taken from the same release. The two change
  # together, and only so.
  VERSION_BEFORE: v0.2.0-alpha.19
  VERSION_BEFORE_SHA256: e7f15e59c089a3d839ad77e25b21abd174cf99c1896c21f474822d765ede4bd6
  # The cargo nextest that every job here installs.
  NEXTEST_VERSION: 0.9.151

jobs:
  lint:
    name: fmt, clippy and doc tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The cache of `target` unpacks to more than some runners have free:
      # three jobs ran out of disk as they restored it, on 4 and 5
      # November. What these jobs never use goes first.
      - name: Room for the cache
        run: |
          for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            sudo rm -rf "$dir" &
          done
          wait
          df -h /

      # Kept from main's runs only; a pull request reads main's.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # cargo nextest runs no doc tests: `cargo test --all` runs them, and
      # so they run here.
      - name: Doc tests
        run: cargo test --doc --workspace

      - name: Install script
        run: sh scripts/test-install.sh

  # Every test binary of the workspace, built once, in one archive that
  # each shard below downloads and runs its part of.
  build:
    name: build the tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Of the debug information, the lines only: the archive that every
      # shard downloads is much smaller, and a panic still says its file
      # and line. No test reads the rest.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      # As in the job above.
      - name: Room for the cache
        run: |
          for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            sudo rm -rf "$dir" &
          done
          wait
          df -h /

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Build the tests, into one archive
        run: cargo nextest archive --workspace --archive-file nextest-archive.tar.zst

      # The archive is compressed already.
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        timeout-minutes: 10
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0

  # Every test that is not ignored, as `cargo test --all` runs them but
  # the doc tests (the first job runs those): each shard runs one part,
  # the parts dealt out in turn, one test to each shard, across every
  # test binary. Each test runs in a process of its own, as many at once
  # as the runner has threads. A shard runs every test of its part,
  # whatever fails, and runs none again.
  shards:
    name: tests, shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          # The binary of the version before runs in this job: no token of
          # the job is left on disk for it. Nothing later here pushes or
          # fetches with git.
          persist-credentials: false

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install cargo nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Download the archive
        uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          name: nextest-archive

      - name: Download the version before
        # The Linux binary of that release, checked against the hash that
        # this file names; the tests that run it read where it is from
        # CORDELIA_TEST_BINARY_BEFORE, and fail in CI without it.
        run: |
          dir="$RUNNER_TEMP/before"
          mkdir -p "$dir"
          base="https://github.com/${{ github.repository }}/releases/download/$VERSION_BEFORE"
          curl -fsSL -o "$dir/cordelia-linux-amd64" "$base/cordelia-linux-amd64"
          echo "$VERSION_BEFORE_SHA256  $dir/cordelia-linux-amd64" | sha256sum -c -
          chmod +x "$dir/cordelia-linux-amd64"
          echo "CORDELIA_TEST_BINARY_BEFORE=$dir/cordelia-linux-amd64" >> "$GITHUB_ENV"

      # The archive is unpacked into this checkout's `target`, where the
      # build job had it: the real-process tests run the `cordelia` that
      # was built there, by the path that was built into them.
      - name: Tests, shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        run: >-
          cargo nextest run --profile ci
          --archive-file nextest-archive.tar.zst
          --workspace-remap "$GITHUB_WORKSPACE"
          --extract-to "$GITHUB_WORKSPACE" --extract-overwrite
          --partition slice:${{ matrix.shard }}/${{ strategy.job-total }}

      # An upload that fails or hangs does not fail the job.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          name: junit-shard-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The check that a pull request needs: it passes only when every job of
  # the gate passed. It runs when one of them failed too, and fails then,
  # but not when the run was cancelled.
  test:
    name: test
    needs: [lint, build, shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job of the gate passed
        env:
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
          SHARDS: ${{ needs.shards.result }}
        run: |
          echo "fmt, clippy and doc tests: $LINT; build: $BUILD; tests: $SHARDS"
          [ "$LINT" = success ] && [ "$BUILD" = success ] && [ "$SHARDS" = success ]

  # The real-process tests that wait out a relay's five minutes out of
  # reach, or a dial's wait growing to its cap (decision 2026-10-19 §11):
  # each is ignored in `cargo test --all`, so that the gate is not made
  # longer, and is run here, on main, in two shards. They are the ignored
  # tests of cordelia-node's test files, and only those: the other
  # crates' ignored tests are timed for a release build, or are no part of
  # this. Each runs whatever another fails. The scale test's ignored tests
  # return at once here: its stages and its small runs run only where
  # their variables are set (scale.yml runs the small runs).
  out-of-reach:
    name: out of reach, shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # About twice the longest of these tests (14 minutes): a test that
    # waits for ever fails the job in this time.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install cargo nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Download the archive
        uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          name: nextest-archive

      - name: The tests of a relay out of reach, ignored for their length
        run: >-
          cargo nextest run --profile ci-out-of-reach
          --archive-file nextest-archive.tar.zst
          --workspace-remap "$GITHUB_WORKSPACE"
          --extract-to "$GITHUB_WORKSPACE" --extract-overwrite
          -E 'package(cordelia-node)' --run-ignored only
          --partition slice:${{ matrix.shard }}/${{ strategy.job-total }}

      # An upload that fails or hangs does not fail the job.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          name: junit-out-of-reach-${{ matrix.shard }}
          path: target/nextest/ci-out-of-reach/junit.xml
          if-no-files-found: ignore

  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The gate runs every test; this one only measures. The shared
    # channel's library tests run slowly under coverage: on slice 8 the
    # job passed two hours with the next crate still running, so it has
    # four.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Install grcov
        run: cargo install grcov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests with coverage
        env:
          CARGO_INCREMENTAL: 0
          # `--cfg coverage` leaves out the test of what timing a take of
          # the node's lock costs (lock.rs): under coverage its counters are
          # in what it measures. The gate runs it.
          RUSTFLAGS: '-Cinstrument-coverage --cfg coverage'
          LLVM_PROFILE_FILE: '/tmp/cordelia-cov/cordelia-%p-%m.profraw'
        run: |
          mkdir -p /tmp/cordelia-cov
          # The sequences of cordelia-sync take hours under coverage and are
          # run in full by the gate.
          cargo test --lib --test two_node -- --skip test_bv19 --skip claude::sequences::

      - name: Generate LCOV report
        run: |
          grcov /tmp/cordelia-cov \
            --binary-path ./target/debug/ \
            -s . \
            -t lcov \
            --ignore-not-existing \
            --ignore "*/.cargo/*" \
            --ignore "*/target/*" \
            -o coverage.lcov

      - name: Upload coverage to SonarCloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true
        timeout-minutes: 10

      # An upload that fails or hangs does not fail the job, whose tests
      # passed: on 11 November this one hung until the runner was lost.
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          name: coverage-report
          path: coverage.lcov
