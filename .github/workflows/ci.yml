name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']

env:
  CARGO_TERM_COLOR: always
  # The newest release before messages between a person's own agents: the
  # upgrade test runs its node beside this build's (decision 2026-10-09
  # §9.2).
  VERSION_BEFORE: v0.2.0-alpha.10

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --all-targets

      - name: Download the version before
        # The Linux binary of that release, checked against the checksum
        # the release publishes beside it; the upgrade test reads where it
        # is from CORDELIA_TEST_BINARY_BEFORE, and fails in CI without it.
        run: |
          dir="$RUNNER_TEMP/before"
          mkdir -p "$dir"
          base="https://github.com/${{ github.repository }}/releases/download/$VERSION_BEFORE"
          curl -fsSL -o "$dir/cordelia-linux-amd64" "$base/cordelia-linux-amd64"
          curl -fsSL -o "$dir/cordelia-linux-amd64.sha256" "$base/cordelia-linux-amd64.sha256"
          (cd "$dir" && sha256sum -c cordelia-linux-amd64.sha256)
          chmod +x "$dir/cordelia-linux-amd64"
          echo "CORDELIA_TEST_BINARY_BEFORE=$dir/cordelia-linux-amd64" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install script
        run: sh scripts/test-install.sh

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Install grcov
        run: cargo install grcov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests with coverage
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: '-Cinstrument-coverage'
          LLVM_PROFILE_FILE: '/tmp/cordelia-cov/cordelia-%p-%m.profraw'
        run: |
          mkdir -p /tmp/cordelia-cov
          cargo test --lib --test two_node -- --skip test_bv19

      - name: Generate LCOV report
        run: |
          grcov /tmp/cordelia-cov \
            --binary-path ./target/debug/ \
            -s . \
            -t lcov \
            --ignore-not-existing \
            --ignore "*/.cargo/*" \
            --ignore "*/target/*" \
            -o coverage.lcov

      - name: Upload coverage to SonarCloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.lcov
