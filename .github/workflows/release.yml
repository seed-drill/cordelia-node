name: Release

# Tags `v*` build and publish a GitHub release. Tags containing a hyphen
# (v0.2.0-alpha.1) publish as pre-releases, which install.sh only installs
# when pinned via CORDELIA_VERSION. Pull requests that touch the release
# path, and manual dispatch, run the build matrix without publishing.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/install.sh'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl binaries, built natively on each architecture,
          # so they run on any distribution regardless of glibc version.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: cordelia-linux-amd64
            musl: true
            native: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            binary: cordelia-linux-arm64
            musl: true
            native: true
          # macOS: macos-latest is Apple silicon; x86_64 is cross-compiled.
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: cordelia-darwin-amd64
            native: false
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: cordelia-darwin-arm64
            native: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cordelia-node") | .version')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match crate version ${crate_version}"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin cordelia

      - name: Smoke test
        if: matrix.native
        run: target/${{ matrix.target }}/release/cordelia --version

      - name: Package binary
        run: |
          cp target/${{ matrix.target }}/release/cordelia ${{ matrix.binary }}
          chmod +x ${{ matrix.binary }}

      - name: Generate checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256
          else
            shasum -a 256 ${{ matrix.binary }} > ${{ matrix.binary }}.sha256
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.binary }}.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"* release/
          done
          # Generate combined checksums file
          cd release
          cat *.sha256 > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/*
            scripts/install.sh
          generate_release_notes: true
