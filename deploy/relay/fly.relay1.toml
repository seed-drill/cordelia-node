# Fly.io: relay1.cordelia.seeddrill.ai (London).
#
# Deploy from the repository root:
#   fly deploy . --config deploy/relay/fly.relay1.toml
#
# Fly requirements for UDP (docs.fly.io/networking/udp-and-tcp):
# - a dedicated IPv4 (fly ips allocate-v4); shared IPv4 and IPv6 do not
#   carry UDP;
# - the app binds UDP to fly-global-services (CORDELIA_LISTEN_ADDR below);
# - the external port equals the internal port (9474);
# - ~1300 bytes of usable packet size (QUIC starts at 1200 and probes up).
# Fly mounts volumes as root, and the image runs as uid 10001: after
# creating the volume, run once: fly ssh console -C "chown 10001:10001 /data".

app = "cordelia-relay1"
primary_region = "lhr"

[build]
  dockerfile = "deploy/relay/Dockerfile"

# Pin the release to deploy (see deploy/relay/Dockerfile).
[build.args]
  CORDELIA_SOURCE = "release"
  CORDELIA_VERSION = ""
  CORDELIA_SHA256 = ""

[env]
  CORDELIA_CONFIG = "/etc/cordelia/relay1.toml"
  CORDELIA_LISTEN_ADDR = "fly-global-services:9474"

[mounts]
  source = "cordelia_data"
  destination = "/data"

# QUIC over UDP only. The HTTP API stays on loopback inside the machine.
[[services]]
  internal_port = 9474
  protocol = "udp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 9474

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
